name: PhotosBackup

options:
  bundleIdPrefix: com.g8row.photosbackup
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    MARKETING_VERSION: "0.3.6"
    CURRENT_PROJECT_VERSION: "14"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    # The configured Personal Team signs device builds. Simulator builds use
    # Xcode's local signing identity, which is sufficient for Keychain access.
    DEVELOPMENT_TEAM: QCXRK5J98S
    CODE_SIGN_STYLE: Automatic

targets:
  PhotosBackup:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: GPMC/Core
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.g8row.photosbackup
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
  PhotosBackupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PhotosBackupTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.g8row.photosbackup.tests
    dependencies:
      - target: PhotosBackup

schemes:
  PhotosBackup:
    build:
      targets:
        PhotosBackup: all
        PhotosBackupTests: [test]
    test:
      targets:
        - PhotosBackupTests
