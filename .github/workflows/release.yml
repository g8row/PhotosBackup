name: release-ipa

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach unsigned IPA
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # The whole point of building here is that a release binary can be tied
      # to the commit AND the toolchain it claims. Falling back to whatever the
      # runner image ships would quietly break that, so a missing pin fails the
      # build instead: bump the version here deliberately when it is retired.
      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner. Available:"
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$XCODE_APP/Contents/Developer" xcodebuild -version
        env:
          XCODE_APP: /Applications/Xcode_26.3.app

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Build unsigned IPA
        run: Scripts/make-ipa.sh

      - name: Checksum
        run: |
          shasum -a 256 build/PhotosBackup.ipa | awk '{print $1}' > build/PhotosBackup.ipa.sha256
          echo "sha256: $(cat build/PhotosBackup.ipa.sha256)"

      - name: Attach IPA and checksum to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            build/PhotosBackup.ipa build/PhotosBackup.ipa.sha256 --clobber
          echo "Attached to release $GITHUB_REF_NAME"

      - name: Upload workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: PhotosBackup-ipa
          path: |
            build/PhotosBackup.ipa
            build/PhotosBackup.ipa.sha256
          if-no-files-found: error
